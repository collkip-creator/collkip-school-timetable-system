name: Build Collkip Teacher Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'vite.mobile.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Provide AppDeploy client shim for standalone APK build
        shell: bash
        run: |
          mkdir -p node_modules/@appdeploy/client
          cat > node_modules/@appdeploy/client/package.json <<'EOF'
          {"name":"@appdeploy/client","version":"0.0.0-ci","type":"module"}
          EOF
          cat > node_modules/@appdeploy/client/index.js <<'EOF'
          const API_BASE = 'https://collkip-school-timetable-system-6h732l.v2.appdeploy.ai';
          const request = async (method, path, data) => {
            const response = await fetch(`${API_BASE}${path}`, { method, headers: { 'Content-Type': 'application/json' }, body: data === undefined ? undefined : JSON.stringify(data) });
            const text = await response.text();
            let parsed;
            try { parsed = text ? JSON.parse(text) : null; } catch { parsed = text; }
            if (!response.ok) throw new Error(parsed?.error || parsed?.message || `Request failed with status ${response.status}`);
            return { data: parsed };
          };
          export const api = { get: path => request('GET', path), post: (path, data) => request('POST', path, data) };
          export const auth = {
            async getUser() { return null; },
            async signIn() { throw new Error('Super Admin sign-in is only available in the hosted AppDeploy portal.'); },
            async signOut() {},
          };
          EOF
      - name: Build dedicated teacher-only mobile assets
        run: npm run build:mobile
      - name: Generate Android platform if missing
        shell: bash
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: collkip-teacher-android-pilot-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
