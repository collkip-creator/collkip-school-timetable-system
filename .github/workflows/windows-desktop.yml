name: Build Collkip Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Synchronize npm lock file
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci

      - name: Provide AppDeploy client shim for standalone Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_modules/@appdeploy/client | Out-Null
          @'
          {"name":"@appdeploy/client","version":"0.0.0-ci","type":"module"}
          '@ | Set-Content node_modules/@appdeploy/client/package.json
          @'
          const API_BASE = 'https://api-v2.appdeploy.ai/app/collkip-school-timetable-system-6h732l';
          const request = async (method, path, data) => {
            const response = await fetch(`${API_BASE}${path}`, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: data === undefined ? undefined : JSON.stringify(data),
            });
            const text = await response.text();
            let parsed;
            try { parsed = text ? JSON.parse(text) : null; } catch { parsed = text; }
            if (!response.ok) throw new Error(parsed?.error || parsed?.message || `Request failed with status ${response.status}`);
            return { data: parsed };
          };
          export const api = {
            get: path => request('GET', path),
            post: (path, data) => request('POST', path, data),
          };
          export const auth = {
            async getUser() { return null; },
            async signIn() { throw new Error('Administrator login is not available in desktop version of collkip'); },
            async signOut() {},
          };
          '@ | Set-Content node_modules/@appdeploy/client/index.js

      - name: Build Windows NSIS installer
        run: npm run desktop:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collkip-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
