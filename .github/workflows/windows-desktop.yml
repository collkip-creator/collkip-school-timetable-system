name: Build Collkip Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Synchronize npm lock file
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci

      - name: Provide AppDeploy client shim
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_modules/@appdeploy/client | Out-Null

          @"
          export const appDeploy = {
            getApp: async () => null,
          };
          export default appDeploy;
          "@ | Set-Content node_modules/@appdeploy/client/index.js

          @"
          {
            "name": "@appdeploy/client",
            "version": "0.0.0-local",
            "type": "module",
            "main": "index.js"
          }
          "@ | Set-Content node_modules/@appdeploy/client/package.json

      - name: Build Windows NSIS installer
        run: npm run desktop:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collkip-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
